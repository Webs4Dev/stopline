# Spec section 20.2. Lint, types, tests on the OS x Python matrix, coverage gate,
# ASCII check, wheel build with an install test.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Reject non-ASCII in source, tests and config (spec section 19.1)
        run: >
          ! grep -rIlP '[^\x00-\x7F]' src tests .github pyproject.toml .pre-commit-config.yaml

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: "Tests with coverage gate (NFR-10, 80 percent overall)"
        run: uv run pytest --cov=stopline --cov-fail-under=80

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the built wheel in a clean environment and run it
        run: |
          uv venv "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test" dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/stopline" --version
          "$RUNNER_TEMP/wheel-test/bin/python" -c "import stopline; print(stopline.__version__)"
